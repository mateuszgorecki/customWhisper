name: CustomWhisper
options:
  bundleIdPrefix: com.customwhisper
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.7.9"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.4.0"

targets:
  CustomWhisper:
    type: application
    platform: macOS
    sources:
      - path: CustomWhisper
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.customwhisper.CustomWhisper
        PRODUCT_NAME: CustomWhisper
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: CustomWhisper/CustomWhisper.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: CustomWhisper/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
    entitlements:
      path: CustomWhisper/CustomWhisper.entitlements
      properties:
        com.apple.security.device.audio-input: true

  CustomWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CustomWhisperTests
    dependencies:
      - target: CustomWhisper
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CustomWhisper.app/Contents/MacOS/CustomWhisper"
        SWIFT_VERSION: "5.9"

  CustomWhisperUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CustomWhisperUITests
    dependencies:
      - target: CustomWhisper
    settings:
      base:
        SWIFT_VERSION: "5.9"
